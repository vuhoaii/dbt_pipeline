name: dbt CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Lấy code từ GitHub
      uses: actions/checkout@v3

    - name: 2. Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Sửa thành 3.11 để hết cảnh báo vàng

    - name: 3. Cài đặt dbt-bigquery
      run: pip install dbt-bigquery

    - name: 4. Giải mã chìa khóa Google Cloud
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > keyfile.json
        echo "Kích thước file chìa khóa:" 
        ls -l keyfile.json # In ra kích thước để kiểm tra

    - name: 5. Cài đặt thư viện phụ thuộc
      run: dbt deps

    - name: 6. Chạy dbt test
      run: dbt test --profiles-dir .